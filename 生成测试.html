<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>画师测试生成</title>
  <script src="jszip.min.js"></script>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #f3f6f9;
      --surface: #ffffff;
      --surface2: #eef2f7;
      --surface3: #e2e8f0;
      --border: #d6deea;
      --accent: #0fb9a8;
      --accent2: #4aa8d5;
      --accent-rgb: 15, 185, 168;
      --text: #1f2a37;
      --text2: #5b6b7e;
      --text3: #94a3b8;
      --danger: #e9576b;
      --success: #28c08a;
      --radius: 12px;
      --radius-sm: 8px;
      --shadow: 0 2px 10px rgba(31, 42, 55, 0.06);
      --shadow-lg: 0 10px 30px rgba(31, 42, 55, 0.10);
    }

    body {
      font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: radial-gradient(1200px 800px at 85% -10%, rgba(15, 185, 168, 0.10), transparent 60%),
        radial-gradient(1000px 700px at 0% 100%, rgba(74, 168, 213, 0.12), transparent 60%), var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }

    header {
      padding: 0.9rem 1.4rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(12px);
      box-shadow: var(--shadow);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .logo {
      font-size: 1.25rem;
      font-weight: 700;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-actions {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .layout {
      display: grid;
      grid-template-columns: 400px 1fr;
      gap: 1rem;
      padding: 1rem;
      max-width: 1600px;
      margin: 0 auto;
    }

    @media (max-width: 900px) {
      .layout {
        grid-template-columns: 1fr;
      }
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
    }

    .panel h2 {
      font-size: 0.85rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text2);
      margin-bottom: 0.8rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .field {
      margin-bottom: 0.85rem;
    }

    .field:last-child {
      margin-bottom: 0;
    }

    label {
      display: block;
      font-size: 0.8rem;
      color: var(--text2);
      margin-bottom: 0.3rem;
    }

    input[type="text"],
    input[type="number"],
    textarea,
    select {
      width: 100%;
      padding: 0.55rem 0.7rem;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 0.88rem;
      font-family: inherit;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    input:focus,
    textarea:focus,
    select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(var(--accent-rgb), 0.18);
    }

    textarea {
      resize: vertical;
      min-height: 80px;
      line-height: 1.45;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.6rem;
    }

    .row-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 0.6rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      padding: 0.6rem 1rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text);
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      font-family: inherit;
      white-space: nowrap;
    }

    .btn:hover {
      border-color: var(--accent);
      background: var(--surface3);
    }

    .btn-primary {
      background: linear-gradient(90deg, var(--accent), #7d5fff);
      border-color: transparent;
      color: #fff;
    }

    .btn-primary:hover {
      filter: brightness(1.12);
      box-shadow: 0 4px 16px rgba(var(--accent-rgb), 0.4);
    }

    .btn-sm {
      padding: 0.35rem 0.6rem;
      font-size: 0.78rem;
    }

    .btn-xs {
      padding: 0.2rem 0.4rem;
      font-size: 0.72rem;
    }

    .btn-mini {
      padding: 0.15rem 0.45rem;
      font-size: 0.68rem;
      border-radius: 10px;
      line-height: 1.3;
      font-weight: 500;
    }

    /* 正面词预设按钮：小巧精致，与负面词区分（青绿色调） */
    .pos-preset-btn {
      font-size: 0.72rem;
      padding: 0.22rem 0.5rem;
      border-radius: 5px;
      background: rgba(var(--accent-rgb), 0.08);
      border: 1px solid rgba(var(--accent-rgb), 0.3);
      color: var(--accent);
      cursor: pointer;
      position: relative;
      transition: all 0.15s;
    }

    .pos-preset-btn:hover {
      background: rgba(var(--accent-rgb), 0.18);
    }

    .pos-preset-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .pos-preset-btn .delete-preset,
    .pos-preset-btn .edit-preset {
      position: absolute;
      top: -4px;
      width: 14px;
      height: 14px;
      font-size: 10px;
      line-height: 12px;
      color: #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.15s;
    }

    .pos-preset-btn .delete-preset {
      right: -4px;
      background: var(--danger);
    }

    .pos-preset-btn .edit-preset {
      left: -4px;
      background: var(--accent);
    }

    .pos-preset-btn:hover .delete-preset,
    .pos-preset-btn:hover .edit-preset {
      opacity: 1;
    }

    .btn-ghost {
      background: transparent;
    }

    .btn-danger {
      background: rgba(255, 107, 138, 0.15);
      border-color: var(--danger);
      color: var(--danger);
    }

    .btn-danger:hover {
      background: rgba(255, 107, 138, 0.25);
    }

    /* 抽取卡片 */
    #diceResults {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.6rem;
    }

    .dice-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 0.7rem;
    }

    .dice-card-header {
      display: flex;
      align-items: flex-start;
      gap: 0.5rem;
    }

    .dice-card-index {
      font-size: 0.75rem;
      color: var(--text3);
      font-weight: 600;
    }

    .dice-card-name {
      flex: 1;
      font-weight: 600;
      font-size: 0.9rem;
      word-break: break-all;
      line-height: 1.4;
    }

    .dice-card-actions {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    .dice-card-body {
      margin-top: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .weight-input-wrap {
      display: flex;
      align-items: center;
      gap: 0.25rem;
      flex: 1;
    }

    .weight-btn {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      padding: 0;
    }

    .weight-input {
      width: 60px;
      text-align: center;
      padding: 0.3rem;
      font-size: 0.85rem;
    }

    .pin-btn {
      font-size: 0.75rem;
      padding: 0.25rem 0.4rem;
    }

    .pin-btn.active {
      background: rgba(160, 125, 255, 0.2);
      border-color: var(--accent);
    }

    /* 画师作品预览 */
    .artist-preview {
      margin-top: 0.5rem;
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.3rem;
    }

    .preview-img {
      aspect-ratio: 2/3;
      border-radius: 4px;
      overflow: hidden;
      background: var(--surface3);
      cursor: pointer;
      border: 1px solid transparent;
      width: 100%;
    }

    .preview-img:hover {
      border-color: var(--accent);
    }

    .preview-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* 可折叠面板 */
    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      padding: 0.2rem 0;
    }

    .panel-header:hover {
      opacity: 0.8;
    }

    .panel-header h2 {
      margin-bottom: 0;
    }

    .panel-header .toggle-icon {
      font-size: 0.75rem;
      transition: transform 0.2s;
    }

    .panel-header.collapsed .toggle-icon {
      transform: rotate(-90deg);
    }

    .panel-content {
      overflow: hidden;
      transition: max-height 0.3s, opacity 0.3s;
    }

    .panel-content.collapsed {
      max-height: 0 !important;
      opacity: 0;
      padding-top: 0 !important;
    }

    .collapse-group {
      margin-top: 0.85rem;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      overflow: hidden;
      background: var(--surface2);
    }

    .collapse-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.6rem 0.75rem;
      cursor: pointer;
      background: var(--surface3);
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text2);
      transition: background 0.15s;
    }

    .collapse-header:hover {
      background: var(--surface3);
      opacity: 0.85;
    }

    .collapse-icon {
      font-size: 0.65rem;
      color: var(--accent);
      transition: transform 0.2s ease;
    }

    .collapse-header.collapsed .collapse-icon {
      transform: rotate(-90deg);
    }

    .collapse-content {
      padding: 0.85rem;
      overflow: hidden;
      transition: max-height 0.3s ease, opacity 0.2s;
    }

    .collapse-content.collapsed {
      max-height: 0 !important;
      opacity: 0;
      padding: 0 !important;
    }

    /* 负面词预设 */
    .neg-presets {
      display: flex;
      gap: 0.3rem;
      flex-wrap: wrap;
      margin-bottom: 0.5rem;
    }

    .neg-preset-btn {
      font-size: 0.75rem;
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      background: var(--surface3);
      border: 1px solid var(--border);
      color: var(--text2);
      cursor: pointer;
      position: relative;
    }

    .neg-preset-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .neg-preset-btn .delete-preset {
      position: absolute;
      top: -4px;
      right: -4px;
      width: 14px;
      height: 14px;
      font-size: 10px;
      line-height: 12px;
      background: var(--danger);
      color: #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.15s;
    }

    .neg-preset-btn .edit-preset {
      position: absolute;
      top: -4px;
      left: -4px;
      width: 14px;
      height: 14px;
      font-size: 10px;
      line-height: 12px;
      background: var(--accent);
      color: #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.15s;
    }

    .neg-preset-btn:hover .delete-preset,
    .neg-preset-btn:hover .edit-preset {
      opacity: 1;
    }

    /* 生成区域 */
    .image-area {
      min-height: 500px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
    }

    .result-img {
      max-width: 100%;
      max-height: 70vh;
      border-radius: var(--radius);
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
      object-fit: contain;
    }

    .placeholder {
      color: var(--text3);
      text-align: center;
      padding: 3rem 1rem;
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      width: 100%;
    }

    .placeholder .big {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
    }

    .status-bar {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.6rem 0.8rem;
      background: var(--surface2);
      border-radius: var(--radius-sm);
      font-size: 0.82rem;
      color: var(--text2);
      margin-top: 0.8rem;
      min-height: 38px;
    }

    .queue-status {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding: 0.5rem 0.8rem;
      margin-top: 0.5rem;
      background: rgba(var(--accent-rgb), 0.10);
      border: 1px solid rgba(var(--accent-rgb), 0.25);
      border-radius: var(--radius-sm);
      font-size: 0.82rem;
      color: var(--text2);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text3);
      flex-shrink: 0;
    }

    .dot.loading {
      background: var(--accent2);
      animation: pulse 1s infinite;
    }

    .dot.ok {
      background: var(--success);
    }

    .dot.err {
      background: var(--danger);
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.3;
      }
    }

    .progress-wrap {
      width: 100%;
      max-width: 500px;
      display: none;
    }

    .progress-wrap.active {
      display: block;
    }

    .progress {
      height: 6px;
      background: var(--surface3);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 30%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius: 999px;
      animation: indeterminate 1.4s infinite;
    }

    @keyframes indeterminate {
      0% {
        transform: translateX(-100%);
      }

      100% {
        transform: translateX(400%);
      }
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--surface3);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.7rem 1.2rem;
      border-radius: var(--radius-sm);
      font-size: 0.88rem;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s;
      z-index: 200;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.4);
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .toast.err {
      border-color: var(--danger);
      color: var(--danger);
    }

    .toast.ok {
      border-color: var(--success);
      color: var(--success);
    }

    /* 模态框 */
    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 1rem;
    }

    .modal-bg.active {
      display: flex;
    }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.2rem;
      max-width: 500px;
      width: 100%;
    }

    .modal h3 {
      margin-bottom: 0.8rem;
      color: var(--text);
    }

    .modal .btn {
      margin-top: 0.5rem;
    }

    .img-modal-content {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .img-modal-content img {
      max-width: 100%;
      max-height: 70vh;
      border-radius: var(--radius);
    }

    .result-meta {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    /* 生成历史 */
    .history-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
      margin-top: 0.5rem;
      max-height: 300px;
      overflow-y: auto;
    }

    .history-item {
      aspect-ratio: 2/3;
      border-radius: 4px;
      overflow: hidden;
      background: var(--surface3);
      cursor: pointer;
      border: 1px solid transparent;
      position: relative;
    }

    .history-item:hover {
      border-color: var(--accent);
    }

    .history-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .history-item .history-meta {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(transparent, rgba(0, 0, 0, 0.7));
      padding: 0.3rem;
      font-size: 0.65rem;
      color: var(--text2);
      display: none;
    }

    .history-item:hover .history-meta {
      display: block;
    }

    .chip {
      background: var(--surface2);
      border: 1px solid var(--border);
      padding: 0.25rem 0.6rem;
      border-radius: 999px;
      font-size: 0.78rem;
      color: var(--text2);
    }
  </style>
</head>

<body>
  <header>
    <div class="logo">◆ 画师测试生成</div>
    <div class="header-actions">
      <span class="chip" id="dataStats" style="font-size:0.8rem;color:var(--text2)">加载中...</span>
      <button class="btn btn-ghost btn-sm" id="btnRefresh">🔄 刷新数据</button>
      <button class="btn btn-ghost" id="btnBack">← 返回画师库</button>
      <button class="btn btn-ghost" id="btnSettings">⚙ 设置</button>
    </div>
  </header>

  <div class="layout">
    <!-- 左侧面板 -->
    <div class="panel">
      <div class="panel-header" id="diceSettingsHeader">
        <h2>◆ 抽取设置</h2>
        <span class="toggle-icon">▶</span>
      </div>
      <div class="panel-content" id="diceSettingsContent">
        <div class="field">
          <label>抽取数量：</label>
          <input type="number" id="diceCount" value="5" min="1" max="30">
        </div>
        <div class="row">
          <div class="field">
            <label>权重范围：</label>
            <input type="number" id="weightMin" value="0.1" min="0" step="0.01">
          </div>
          <div class="field">
            <label>~</label>
            <input type="number" id="weightMax" value="2.0" min="0" step="0.01">
          </div>
        </div>
        <div class="field">
          <label>特殊权重人数：</label>
          <div class="row" style="gap:0.3rem">
            <input type="number" id="diceSpecialCountMin" value="1" min="0" max="30" style="flex:1">
            <span>~</span>
            <input type="number" id="diceSpecialCountMax" value="2" min="0" max="30" style="flex:1">
          </div>
        </div>
        <div class="row">
          <div class="field">
            <label>分割点 Y：</label>
            <input type="number" id="diceWeightSplit" value="1.0" min="0" step="0.01">
          </div>
          <div class="field">
            <label>方向：</label>
            <select id="diceSpecialDirection">
              <option value="above">特殊 ≥ Y</option>
              <option value="below">特殊 ≤ Y</option>
            </select>
          </div>
        </div>
        <button class="btn btn-primary" id="btnDice" style="width:100%;margin-top:0.5rem">🎲 抽取画师</button>
        <button class="btn btn-ghost" id="btnClear" style="width:100%;margin-top:0.3rem">清空结果</button>
      </div>

      <div style="border-top:1px solid var(--border);margin-top:1rem;padding-top:1rem;">
        <div class="panel-header" id="importSettingsHeader">
          <h2>◆ 导入画师串</h2>
          <span class="toggle-icon">▶</span>
        </div>
        <div class="panel-content" id="importSettingsContent">
          <textarea id="importStr" placeholder="0.2::artist:agfdgf ::, 0.79::artist:sheya ::..."
            style="min-height:60px;margin-bottom:0.5rem"></textarea>
          <button class="btn btn-primary btn-sm" id="btnImport" style="width:100%">导入</button>
        </div>
      </div>
    </div>

    <!-- 中间抽取结果 -->
    <div class="panel">
      <div class="panel-header" id="diceResultsHeader">
        <h2>◆ 抽取结果</h2>
        <span class="toggle-icon">▶</span>
      </div>
      <div class="panel-content" id="diceResultsContent">
        <button class="btn btn-xs btn-ghost" id="btnCopyArtistString" style="margin-bottom:0.5rem;float:right">📋
          复制画师串</button>
        <button class="btn btn-xs btn-ghost" id="btnResetWeights"
          style="margin-bottom:0.5rem;float:right;margin-right:0.3rem">⚖ 权重置一</button>
        <div style="clear:both"></div>
        <div id="diceResults"></div>
        <div id="diceEmpty" class="placeholder" style="margin-top:1rem">
          <div class="big">🎲</div>
          <div>点击左侧「抽取画师」或导入画师串</div>
        </div>
      </div>
    </div>

    <!-- 右侧生成面板 -->
    <div class="panel">

          <textarea id="negativePrompt" placeholder="lowres, bad anatomy, bad hands..."></textarea>

                <label>种子</label>

            <div class="row">
              <div class="field">
                <label>UC 预设</label>
                <select id="ucPreset">
                  <option value="none">None</option>
                  <option value="soft">Soft</option>
                  <option value="medium">Medium</option>
                  <option value="heavy">Heavy</option>

              </div>
              <div class="field">
                <label>噪声调度</label>
                <select id="noiseSchedule">
                  <option value="native">Native</option>
                  <option value="karras">Karras</option>
                  <option value="exponential">Exponential</option>
                  <option value="polyexponential">Polyexponential</option>

      <button class="btn btn-primary" id="btnGenerate" style="width:100%;margin-top:0.5rem">✦ 生成图片</button>

      <div class="progress-wrap" id="progressWrap">
        <div class="progress">
          <div class="progress-bar"></div>
        </div>

      <div class="status-bar">
        <span class="dot" id="statusDot"></span>

      <div class="queue-status" id="queueStatus" style="display:none">
        <span id="queuePosition">排队中</span>

          <div class="history-grid" id="historyGrid"></div>

      <div class="field">
        <label>API 基础地址</label>
        <input type="text" id="apiBase" value="https://image.novelai.net">
      </div>
      <div class="field">
        <label style="display:flex;align-items:center;gap:0.4rem;cursor:pointer">
          <input type="checkbox" id="enableCloudQueue" style="width:auto"> 启用云端队列（多人共享 Token 排队生成）
        </label>

        <label>队列服务地址</label>
        <input type="text" id="cloudQueueUrl" placeholder="https://st-chatu-novelai-queue.hf.space">

      <div class="field" id="cloudQueueGreetingField" style="display:none">
        <label>排队个性语 (15字)</label>
        <input type="text" id="cloudQueueGreeting" placeholder="正在生成中~" maxlength="15">

  <!-- 图片预览弹窗 -->
  <div class="modal-bg" id="imgModal">
    <div class="modal img-modal-content">
      <img id="modalImg" alt="预览">
      <button class="btn btn-ghost" id="btnCloseImg" style="margin-top:0.5rem">关闭</button>
    </div>
  </div>

  <!-- 添加预设弹窗 -->
  <div class="modal-bg" id="addPresetModal">
    <div class="modal">
      <h3>添加负面词预设</h3>
      <div class="field">
        <label>预设名称</label>
        <input type="text" id="presetName" placeholder="例如：我的预设">
      </div>
      <div class="field">
        <label>负面词内容</label>
        <textarea id="presetContent" placeholder="lowres, bad anatomy, bad hands..."
          style="min-height:100px"></textarea>
      </div>
      <div style="display:flex;gap:0.5rem;justify-content:flex-end;margin-top:1rem">
        <button class="btn btn-ghost" id="btnCancelPreset">取消</button>
        <button class="btn btn-primary" id="btnConfirmPreset">添加</button>
      </div>
    </div>
  </div>

  <!-- 编辑预设弹窗 -->
  <div class="modal-bg" id="editPresetModal">
    <div class="modal">
      <h3>编辑负面词预设</h3>
      <div class="field">
        <label>预设名称</label>
        <input type="text" id="editPresetName" placeholder="例如：我的预设">
      </div>
      <div class="field">
        <label>负面词内容</label>
        <textarea id="editPresetContent" placeholder="lowres, bad anatomy, bad hands..."
          style="min-height:100px"></textarea>
      </div>
      <div style="display:flex;gap:0.5rem;justify-content:flex-end;margin-top:1rem">
        <button class="btn btn-ghost" id="btnCancelEditPreset">取消</button>
        <button class="btn btn-primary" id="btnConfirmEditPreset">保存</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const $ = id => document.getElementById(id);
    const LS_KEY = 'artist_gen_settings_v1';
    const NEG_PRESETS_KEY = 'artist_gen_neg_presets_v1';
    const HISTORY_KEY = 'artist_gen_history_v1';

    let settings = {
      token: '',
      apiBase: 'https://image.novelai.net',
      saveToken: true,
      model: 'nai-diffusion-4-5-full',
      resolution: '832x1216',
      sampler: 'k_euler',
      noiseSchedule: 'native',
      steps: 28,
      scale: 6,
      seed: -1,
      ucPreset: 'none',
      fixedPrompt: '',
      negativePrompt: '',
      enableCloudQueue: false,
      cloudQueueUrl: '',
      cloudQueueGreeting: '正在生成中~'
    };
    let artists = [], groups = [], artworks = [], images = {};
    let diceResults = [];
    let db = null;
    let genHistory = [];

    // 默认负面词预设
    const DEFAULT_NEG_PRESETS = [
      { name: 'Heavy', text: 'lowres, bad anatomy, bad hands, text, error, missing fingers, extra digit, fewer digits, cropped, worst quality, low quality, normal quality, jpeg artifacts, signature, watermark, username, blurry, artist name' },
      { name: 'Light', text: 'lowres, bad anatomy, bad hands, text, error, missing fingers, extra digit, fewer digits, cropped, worst quality, low quality' },
      { name: 'Human', text: 'lowres, bad anatomy, bad hands, text, error, missing fingers, extra digit, fewer digits, cropped, worst quality, low quality, normal quality, jpeg artifacts, signature, watermark, username, blurry, artist name, deformed, disfigured, poorly drawn face, mutation, mutated, extra limb, ugly, poorly drawn hands, missing limb, floating limbs, disconnected limbs, malformed hands, blur, out of focus, long neck, long body' },
      { name: 'None', text: '' }
    ];

    let negPresets = [];
    let currentPresetIdx = 0;

    // 正面词预设
    const POS_PRESETS_KEY = 'artist_gen_pos_presets_v1';
    const DEFAULT_POS_PRESETS = [
      { name: '通用少女', text: '1girl, solo, masterpiece, best quality, highly detailed' },
      { name: '通用少年', text: '1boy, solo, masterpiece, best quality, highly detailed' },
      { name: '双人', text: '2girls, masterpiece, best quality, highly detailed' },
      { name: '空白', text: '' }
    ];
    let posPresets = [];
    let currentPosPresetIdx = 0;
    // 预设操作模式：'neg' 或 'pos'，复用同一套添加/编辑弹窗
    let presetMode = 'neg';
    let editPresetIdx = -1;

    // 加载设置
    try {
      const saved = JSON.parse(localStorage.getItem(LS_KEY) || '{}');
      settings = { ...settings, ...saved };
    } catch (e) { }
    $('token').value = settings.token || '';
    $('apiBase').value = settings.apiBase || 'https://image.novelai.net';
    $('model').value = settings.model || 'nai-diffusion-4-5-full';
    $('resolution').value = settings.resolution || '832x1216';
    $('sampler').value = settings.sampler || 'k_euler';
    $('noiseSchedule').value = settings.noiseSchedule || 'native';
    $('steps').value = settings.steps || 28;
    $('scale').value = settings.scale || 6;
    $('seed').value = settings.seed || -1;
    $('ucPreset').value = settings.ucPreset || 'none';
    $('fixedPrompt').value = settings.fixedPrompt || '';
    $('enableCloudQueue').checked = settings.enableCloudQueue || false;
    $('cloudQueueUrl').value = settings.cloudQueueUrl || '';
    $('cloudQueueGreeting').value = settings.cloudQueueGreeting || '正在生成中~';
    $('cloudQueueUrlField').style.display = settings.enableCloudQueue ? 'block' : 'none';
    $('cloudQueueGreetingField').style.display = settings.enableCloudQueue ? 'block' : 'none';

    // 加载负面词预设
    function loadNegPresets() {
      try {
        const saved = JSON.parse(localStorage.getItem(NEG_PRESETS_KEY) || '[]');
        negPresets = saved.length > 0 ? saved : DEFAULT_NEG_PRESETS;
      } catch (e) {
        negPresets = DEFAULT_NEG_PRESETS;
      }
    }

    function saveNegPresets() {
      try {
        localStorage.setItem(NEG_PRESETS_KEY, JSON.stringify(negPresets));
      } catch (e) { }
    }

    function renderNegPresets() {
      const btns = $('negPresetBtns');
      btns.innerHTML = negPresets.map((p, i) => `
        <button class="neg-preset-btn${i === currentPresetIdx ? ' active' : ''}" data-idx="${i}">
          ${i + 1}. ${p.name}
          <span class="edit-preset" data-edit="${i}">✎</span>
          ${i >= DEFAULT_NEG_PRESETS.length ? '<span class="delete-preset" data-del="' + i + '">×</span>' : ''}
        </button>
      `).join('');

      btns.querySelectorAll('.neg-preset-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          if (e.target.classList.contains('delete-preset') || e.target.classList.contains('edit-preset')) return;
          const idx = parseInt(btn.dataset.idx);
          currentPresetIdx = idx;
          $('negativePrompt').value = negPresets[idx].text;
          renderNegPresets();
        });
      });

      btns.querySelectorAll('.delete-preset').forEach(delBtn => {
        delBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          const idx = parseInt(delBtn.dataset.del);
          if (idx >= DEFAULT_NEG_PRESETS.length) {
            negPresets.splice(idx, 1);
            if (currentPresetIdx >= negPresets.length) currentPresetIdx = negPresets.length - 1;
            if (currentPresetIdx < 0) currentPresetIdx = 0;
            $('negativePrompt').value = negPresets[currentPresetIdx].text;
            saveNegPresets();
            renderNegPresets();
            toast('预设已删除');
          }
        });
      });

      btns.querySelectorAll('.edit-preset').forEach(editBtn => {
        editBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          const idx = parseInt(editBtn.dataset.edit);
          editPresetIdx = idx;
          presetMode = 'neg';
          $('editPresetName').value = negPresets[idx].name;
          $('editPresetContent').value = negPresets[idx].text;
          document.querySelector('#editPresetModal h3').textContent = '编辑负面词预设';
          document.querySelector('#editPresetContent').placeholder = 'lowres, bad anatomy, bad hands...';
          $('editPresetModal').classList.add('active');
        });
      });
    }

    // ==================== 正面词预设系统 ====================
    function loadPosPresets() {
      try {
        const saved = JSON.parse(localStorage.getItem(POS_PRESETS_KEY) || '[]');
        posPresets = saved.length > 0 ? saved : DEFAULT_POS_PRESETS;
      } catch (e) { posPresets = DEFAULT_POS_PRESETS; }
    }
    function savePosPresets() {
      try { localStorage.setItem(POS_PRESETS_KEY, JSON.stringify(posPresets)); } catch (e) { }
    }
    function renderPosPresets() {
      const btns = $('posPresetBtns');
      btns.innerHTML = posPresets.map((p, i) => `
        <button class="pos-preset-btn${i === currentPosPresetIdx ? ' active' : ''}" data-idx="${i}">
          ${i + 1}. ${p.name}
          <span class="edit-preset" data-edit="${i}">✎</span>
          ${i >= DEFAULT_POS_PRESETS.length ? '<span class="delete-preset" data-del="' + i + '">×</span>' : ''}
        </button>
      `).join('');
      btns.querySelectorAll('.pos-preset-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          if (e.target.classList.contains('delete-preset') || e.target.classList.contains('edit-preset')) return;
          const idx = parseInt(btn.dataset.idx);
          currentPosPresetIdx = idx;
          $('fixedPrompt').value = posPresets[idx].text;
          renderPosPresets();
          saveUIState();
        });
      });
      btns.querySelectorAll('.delete-preset').forEach(delBtn => {
        delBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          const idx = parseInt(delBtn.dataset.del);
          if (idx >= DEFAULT_POS_PRESETS.length) {
            posPresets.splice(idx, 1);
            if (currentPosPresetIdx >= posPresets.length) currentPosPresetIdx = posPresets.length - 1;
            if (currentPosPresetIdx < 0) currentPosPresetIdx = 0;
            $('fixedPrompt').value = posPresets[currentPosPresetIdx]?.text || '';
            savePosPresets();
            renderPosPresets();
            saveUIState();
            toast('预设已删除');
          }
        });
      });
      btns.querySelectorAll('.edit-preset').forEach(editBtn => {
        editBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          const idx = parseInt(editBtn.dataset.edit);
          editPresetIdx = idx;
          presetMode = 'pos';
          $('editPresetName').value = posPresets[idx].name;
          $('editPresetContent').value = posPresets[idx].text;
          document.querySelector('#editPresetModal h3').textContent = '编辑正面词预设';
          document.querySelector('#editPresetContent').placeholder = '1girl, blonde hair, blue eyes, smile...';
          $('editPresetModal').classList.add('active');
        });
      });
    }

    $('btnAddPosPreset').addEventListener('click', () => {
      presetMode = 'pos';
      $('presetName').value = '';
      $('presetContent').value = $('fixedPrompt').value;
      document.querySelector('#addPresetModal h3').textContent = '添加正面词预设';
      document.querySelector('#presetContent').placeholder = '1girl, blonde hair, blue eyes, smile...';
      $('addPresetModal').classList.add('active');
    });

    $('btnSaveCurrentPosPreset').addEventListener('click', () => {
      const content = $('fixedPrompt').value.trim();
      if (!content) { toast('正面词为空', 'err'); return; }
      const name = '自定义 ' + (posPresets.filter(p => p.name.startsWith('自定义')).length + 1);
      posPresets.push({ name, text: content });
      currentPosPresetIdx = posPresets.length - 1;
      savePosPresets();
      renderPosPresets();
      saveUIState();
      toast(`已保存为预设「${name}」`);
    });

    // 添加预设弹窗
    $('btnAddPreset').addEventListener('click', () => {
      presetMode = 'neg';
      $('presetName').value = '';
      $('presetContent').value = $('negativePrompt').value;
      document.querySelector('#addPresetModal h3').textContent = '添加负面词预设';
      document.querySelector('#presetContent').placeholder = 'lowres, bad anatomy, bad hands...';
      $('addPresetModal').classList.add('active');
    });

    $('btnCancelPreset').addEventListener('click', () => {
      $('addPresetModal').classList.remove('active');
    });

    $('btnConfirmPreset').addEventListener('click', () => {
      const name = $('presetName').value.trim();
      const content = $('presetContent').value.trim();
      if (!name) { toast('请输入预设名称', 'err'); return; }
      if (presetMode === 'pos') {
        posPresets.push({ name, text: content });
        currentPosPresetIdx = posPresets.length - 1;
        savePosPresets();
        renderPosPresets();
        $('fixedPrompt').value = content;
      } else {
        negPresets.push({ name, text: content });
        currentPresetIdx = negPresets.length - 1;
        saveNegPresets();
        renderNegPresets();
        $('negativePrompt').value = content;
      }
      saveUIState();
      $('addPresetModal').classList.remove('active');
      toast('预设已添加');
    });

    // 编辑预设弹窗
    $('btnCancelEditPreset').addEventListener('click', () => {
      $('editPresetModal').classList.remove('active');
    });

    $('btnConfirmEditPreset').addEventListener('click', () => {
      const name = $('editPresetName').value.trim();
      const content = $('editPresetContent').value.trim();
      if (!name) { toast('请输入预设名称', 'err'); return; }
      if (presetMode === 'pos') {
        posPresets[editPresetIdx] = { name, text: content };
        currentPosPresetIdx = editPresetIdx;
        savePosPresets();
        renderPosPresets();
        $('fixedPrompt').value = content;
      } else {
        negPresets[editPresetIdx] = { name, text: content };
        currentPresetIdx = editPresetIdx;
        saveNegPresets();
        renderNegPresets();
        $('negativePrompt').value = content;
      }
      saveUIState();
      $('editPresetModal').classList.remove('active');
      toast('预设已保存');
    });

    // 保存当前负面词为新预设
    $('btnSaveCurrentPreset').addEventListener('click', () => {
      const content = $('negativePrompt').value.trim();
      if (!content) { toast('负面词为空', 'err'); return; }
      const name = '自定义 ' + (negPresets.filter(p => p.name.startsWith('自定义')).length + 1);
      negPresets.push({ name, text: content });
      currentPresetIdx = negPresets.length - 1;
      saveNegPresets();
      renderNegPresets();
      saveUIState();
      toast(`已保存为预设「${name}」`);
    });

    // 初始化负面词预设
    loadNegPresets();
    $('negativePrompt').value = settings.negativePrompt || negPresets[currentPresetIdx]?.text || '';
    renderNegPresets();
    // 初始化正面词预设
    loadPosPresets();
    renderPosPresets();

    // ==================== UI 状态缓存（所有输入项自动持久化）====================
    const UI_STATE_KEY = 'artist_gen_ui_state_v1';
    const UI_STATE_IDS = ['diceCount', 'weightMin', 'weightMax', 'diceSpecialCountMin', 'diceSpecialCountMax',
      'diceWeightSplit', 'diceSpecialDirection', 'importStr', 'model', 'resolution', 'sampler', 'steps', 'scale',
      'seed', 'ucPreset', 'noiseSchedule', 'fixedPrompt', 'negativePrompt'];
    function saveUIState() {
      try {
        const state = {};
        UI_STATE_IDS.forEach(id => {
          const el = $(id);
          if (el) state[id] = el.value;
        });
        localStorage.setItem(UI_STATE_KEY, JSON.stringify(state));
      } catch (e) { }
    }
    function loadUIState() {
      try {
        const state = JSON.parse(localStorage.getItem(UI_STATE_KEY) || '{}');
        UI_STATE_IDS.forEach(id => {
          const el = $(id);
          if (el && state[id] !== undefined) el.value = state[id];
        });
      } catch (e) { }
    }
    function bindUIStateAutoSave() {
      UI_STATE_IDS.forEach(id => {
        const el = $(id);
        if (el) el.addEventListener('change', saveUIState);
        if (el && (el.tagName === 'TEXTAREA' || el.tagName === 'INPUT')) {
          el.addEventListener('input', () => { clearTimeout(el._saveTimer); el._saveTimer = setTimeout(saveUIState, 600); });
        }
      });
    }

    // 恢复 UI 状态缓存（覆盖默认值，确保刷新后保持上次输入）
    loadUIState();
    bindUIStateAutoSave();

    // 加载生成历史（图片持久化到独立 IndexedDB，刷新后仍可显示）
    let historyDB = null;
    function initHistoryDB() {
      return new Promise((resolve) => {
        const req = indexedDB.open('genTestHistoryDB', 1);
        req.onupgradeneeded = e => {
          const database = e.target.result;
          if (!database.objectStoreNames.contains('images')) {
            database.createObjectStore('images', { keyPath: 'id' });
          }
        };
        req.onsuccess = () => { historyDB = req.result; resolve(); };
        req.onerror = () => { historyDB = null; resolve(); };
      });
    }
    function historyDBPut(id, blob) {
      return new Promise((resolve) => {
        if (!historyDB) return resolve();
        const tx = historyDB.transaction('images', 'readwrite');
        tx.objectStore('images').put({ id, data: blob });
        tx.oncomplete = () => resolve();
        tx.onerror = () => resolve();
      });
    }
    function historyDBGet(id) {
      return new Promise((resolve) => {
        if (!historyDB) return resolve(null);
        const tx = historyDB.transaction('images', 'readonly');
        const req = tx.objectStore('images').get(id);
        req.onsuccess = () => resolve(req.result?.data || null);
        req.onerror = () => resolve(null);
      });
    }
    function historyDBDelete(id) {
      return new Promise((resolve) => {
        if (!historyDB) return resolve();
        const tx = historyDB.transaction('images', 'readwrite');
        tx.objectStore('images').delete(id);
        tx.oncomplete = () => resolve();
        tx.onerror = () => resolve();
      });
    }

    async function loadGenHistory() {
      try {
        const saved = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
        genHistory = saved;
      } catch (e) {
        genHistory = [];
      }
      // 从 IndexedDB 恢复图片，重建 blob URL
      for (const item of genHistory) {
        try {
          const blob = await historyDBGet(item.id);
          item.imgUrl = blob ? URL.createObjectURL(blob) : '';
        } catch (e) { item.imgUrl = ''; }
      }
      renderGenHistory();
    }

    function saveGenHistory() {
      // 只存元数据，不存 blob URL（URL 刷新后失效）
      const meta = genHistory.map(({ id, seed, model, w, h, time }) => ({ id, seed, model, w, h, time }));
      try {
        localStorage.setItem(HISTORY_KEY, JSON.stringify(meta));
      } catch (e) { }
    }

    async function addGenHistory(imgUrl, seed, model, w, h) {
      const id = 'h_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 6);
      // 将图片 blob 存入 IndexedDB 以便刷新后恢复
      try {
        const resp = await fetch(imgUrl);
        const blob = await resp.blob();
        await historyDBPut(id, blob);
      } catch (e) { }
      genHistory.unshift({ id, imgUrl, seed, model, w, h, time: Date.now() });
      if (genHistory.length > 30) {
        const removed = genHistory.pop();
        if (removed.imgUrl && removed.imgUrl.startsWith('blob:')) {
          URL.revokeObjectURL(removed.imgUrl);
        }
        if (removed.id) await historyDBDelete(removed.id);
      }
      saveGenHistory();
      renderGenHistory();
    }

    // 更新所有祖先 panel-content 的高度（嵌套折叠场景下子级展开/收起需同步父级）
    function updateAncestorHeights(el) {
      let parent = el.parentElement;
      while (parent) {
        if (parent.classList && parent.classList.contains('panel-content') && !parent.classList.contains('collapsed')) {
          parent.style.maxHeight = parent.scrollHeight + 'px';
        }
        parent = parent.parentElement;
      }
    }
    function initCollapsible(headerId, contentId) {
      const header = $(headerId);
      const content = $(contentId);
      if (!header || !content) return;

      const updateHeight = () => {
        content.style.maxHeight = content.classList.contains('collapsed') ? '0' : content.scrollHeight + 'px';
      };

      header.addEventListener('click', () => {
        header.classList.toggle('collapsed');
        content.classList.toggle('collapsed');
        updateHeight();
        updateAncestorHeights(content);
        saveCollapseState(headerId, content.classList.contains('collapsed'));
        // 动画结束后再次校准（嵌套折叠场景）
        setTimeout(() => { updateHeight(); updateAncestorHeights(content); }, 50);
        setTimeout(() => { updateHeight(); updateAncestorHeights(content); }, 350);
      });

      // 恢复持久化状态
      const saved = getCollapseStates();
      if (saved[headerId]) {
        header.classList.add('collapsed');
        content.classList.add('collapsed');
      }

      updateHeight();
      setTimeout(updateHeight, 100);
      setTimeout(() => { updateHeight(); updateAncestorHeights(content); }, 400);
    }

    async function initDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open('NAIGalleryDB', 4);
        request.onerror = () => reject(request.error);
        request.onsuccess = () => {
          db = request.result;
          resolve();
        };
        request.onupgradeneeded = e => {
          const database = e.target.result;
          if (!database.objectStoreNames.contains('artworks')) database.createObjectStore('artworks', { keyPath: 'id' });
          if (!database.objectStoreNames.contains('artists')) database.createObjectStore('artists', { keyPath: 'id' });
          if (!database.objectStoreNames.contains('groups')) database.createObjectStore('groups', { keyPath: 'id' });
          if (!database.objectStoreNames.contains('tags')) database.createObjectStore('tags', { keyPath: 'id' });
          if (!database.objectStoreNames.contains('images')) database.createObjectStore('images', { keyPath: 'id' });
          if (!database.objectStoreNames.contains('albums')) database.createObjectStore('albums', { keyPath: 'id' });
        };
      });
    }

        const req = tx.objectStore(storeName).getAll();

        req.onerror = () => rej(req.error);

    function sanitizeArtistName(name) {
      if (!name) return '';
      let cleaned = name.trim().replace(/\s+/g, "_").replace(/_+$/, "");
      if (/^[A-Z_]+$/.test(cleaned)) {
        cleaned = cleaned.split("_").map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join("_");
      }
      return cleaned;
    }

    function normForSearch(s) {
      if (!s) return "";
      return s.trim().toLowerCase().replace(/_/g, "");
    }

    function buildDicePool() {
      const pool = [];
      artists.filter(a => !a.discarded).forEach(a => pool.push({ id: a.id, name: a.name, type: "单人", isGroup: false }));
      groups.filter(g => !g.discarded).forEach(g => pool.push({ id: g.id, name: g.name, type: "组合", isGroup: true }));
      return pool;
    }

    function randWeight(forceMin, forceMax) {
      let min, max;
      if (forceMin !== undefined && forceMax !== undefined) {
        min = forceMin; max = forceMax;
      } else {
        min = parseFloat($('weightMin').value) || 0.1;
        max = parseFloat($('weightMax').value) || 2.0;
      }
      const lo = Math.min(min, max), hi = Math.max(min, max);
      const v = lo + Math.random() * (hi - lo);
      return Math.round(v * 100) / 100;
    }

    function getArtistArtworks(artistId) {
      return artworks.filter(a => a.artistId === artistId).slice(0, 3);
    }

    function getGroupArtworks(groupId) {
      const memberIds = groups.find(g => g.id === groupId)?.memberIds || [];
      return artworks.filter(a => memberIds.includes(a.artistId)).slice(0, 3);
    }

    const imgCache = new Map();
    const IMG_CACHE_MAX = 120; // LRU 上限，防止内存膨胀
    async function getImage(id) {
      if (!id) return null;
      if (imgCache.has(id)) {
        const val = imgCache.get(id);
        imgCache.delete(id);
        imgCache.set(id, val);
        return val;
      }
      if (images[id]) {
        imgCache.set(id, images[id]);
        return images[id];
      }
      try {
        const row = await dbGetOne('images', id);
        if (row?.data) {
          imgCache.set(id, row.data);
          // LRU 淘汰：超过上限时删除最早的条目
          if (imgCache.size > IMG_CACHE_MAX) {
            const oldest = imgCache.keys().next().value;
            imgCache.delete(oldest);
          }
          return row.data;
        }
      } catch (e) { }
      return null;
    }

                <button class="btn btn-xs btn-danger" onclick="removeDice('${r.key}')">✕</button>
              </div>
            </div>
            <div class="dice-card-body">

                <button class="btn btn-sm weight-btn" onclick="adjustWeight('${r.key}', -0.1)">-</button>
                <input type="number" class="weight-input" value="${r.weight}" step="0.1" onchange="updateWeight('${r.key}', this.value)">
                <button class="btn btn-sm weight-btn" onclick="adjustWeight('${r.key}', 0.1)">+</button>

    function togglePin(key) {

    function removeDice(key) {

    function adjustWeight(key, delta) {
      const r = diceResults.find(x => x.key === key);
      if (r) {
        r.weight = Math.max(0, Math.round((r.weight + delta) * 100) / 100);
        renderDiceResults();

    // 抽取逻辑
    $('btnDice').addEventListener('click', () => {
      console.log('点击抽取按钮');
      console.log('artists数组长度:', artists.length);
      console.log('groups数组长度:', groups.length);

      if (artists.length === 0 && groups.length === 0) {
        toast('数据未加载，请刷新页面重试', 'err');
        console.error('数据未加载，可能是IndexedDB连接问题');
        return;
      }

      const pool = buildDicePool();
      console.log('抽取池长度:', pool.length);

      if (pool.length === 0) { toast('暂无可选画师', 'err'); return; }
      const diceCount = Math.max(1, Math.min(parseInt($('diceCount').value) || 5, pool.length));
      const fixedArtist = diceResults.filter(r => r.pinArtist);
      const fixedKeys = new Set(fixedArtist.map(r => r.key));
      const avail = pool.filter(p => !fixedKeys.has(p.isGroup ? 'g_' + p.id : 'a_' + p.id));
      const shuffled = [...avail].sort(() => Math.random() - 0.5);
      const picked = shuffled.slice(0, Math.max(0, diceCount - fixedArtist.length));

      const totalMin = parseFloat($('weightMin').value) || 0.1;
      const totalMax = parseFloat($('weightMax').value) || 2.0;
      const specialMin = parseInt($('diceSpecialCountMin').value) || 0;
      const specialMax = parseInt($('diceSpecialCountMax').value) || 0;
      const splitY = parseFloat($('diceWeightSplit').value) || 1.0;
      const direction = $('diceSpecialDirection').value;

      const newPickedCount = picked.length;
      let specialCount = Math.max(0, Math.min(specialMax, newPickedCount));
      if (specialMin > specialCount) specialCount = specialMin;
      const normalCount = newPickedCount - specialCount;

      const specialIndices = new Set();
      while (specialIndices.size < specialCount) {
        specialIndices.add(Math.floor(Math.random() * newPickedCount));
      }

      let specialWMin, specialWMax, normalWMin, normalWMax;
      if (direction === 'above') {
        specialWMin = Math.max(totalMin, splitY);
        specialWMax = totalMax;
        normalWMin = totalMin;
        normalWMax = Math.min(totalMax, splitY);
      } else {
        specialWMin = totalMin;
        specialWMax = Math.min(totalMax, splitY);
        normalWMin = Math.max(totalMin, splitY);
        normalWMax = totalMax;
      }

      const newResults = [
        ...fixedArtist,
        ...picked.map((p, i) => {
          let w = specialIndices.has(i) ? randWeight(specialWMin, specialWMax) : randWeight(normalWMin, normalWMax);
          return {
            key: p.isGroup ? 'g_' + p.id : 'a_' + p.id,
            id: p.id, name: p.name, type: p.type, isGroup: p.isGroup,
            weight: w, pinArtist: false, pinWeight: false, rating: 0
          };
        })
      ];

      diceResults = newResults;
      renderDiceResults();
      toast(`成功抽取 ${newResults.length} 位画师`);
    });

    // 导入画师串
    $('btnImport').addEventListener('click', () => {
      const str = $('importStr').value.trim();
      if (!str) { toast('请输入画师串', 'err'); return; }

      if (artists.length === 0) {
        toast('数据尚未加载完成，请稍后重试', 'err');
        return;
      }

      const parts = str.split(/[,，]/).map(p => p.trim()).filter(p => p);
      const pool = buildDicePool();
      const imported = [];
      const notFound = [];
      const parseErrors = [];

      console.log('导入字符串:', str);
      console.log('分割后:', parts);
      console.log('可用画师池:', pool.length);

      for (const part of parts) {
        let match = part.match(/^([\d.]+)::artist:\s*([^:]+?)\s*::$/);
        if (!match) match = part.match(/^([\d.]+)::artist:\s*([^:]+?)\s*:\s*$/);
        if (!match) match = part.match(/^([\d.]+)::artist:\s*([^:]+?)\s*$/);

        if (!match) {
          parseErrors.push(part);
          continue;
        }

        const weight = parseFloat(match[1]);
        const name = sanitizeArtistName(match[2]);

        console.log('解析:', part, '-> 权重:', weight, '名称:', name);

        let found = pool.find(p => p.name === name);
        if (!found) found = pool.find(p => p.name.toLowerCase() === name.toLowerCase());
        if (!found) found = pool.find(p => normForSearch(p.name) === normForSearch(name));
        if (!found) {
          const searchName = name.toLowerCase().replace(/_/g, '');
          found = pool.find(p => p.name.toLowerCase().replace(/_/g, '').includes(searchName));
        }

        if (found) {
          imported.push({
            key: found.isGroup ? 'g_' + found.id : 'a_' + found.id,
            id: found.id, name: found.name, type: found.type, isGroup: found.isGroup,
            weight: weight, pinArtist: false, pinWeight: false, rating: 0
          });
        } else {
          notFound.push(name);
        }
      }

      if (imported.length === 0) {
        let errMsg = '';
        if (parseErrors.length > 0) errMsg = `格式错误：${parseErrors.slice(0, 3).join(', ')}`;
        if (notFound.length > 0) errMsg += (errMsg ? '，' : '') + `未找到：${notFound.slice(0, 3).join(', ')}`;
        if (!errMsg) errMsg = '未识别到有效格式';
        toast(errMsg, 'err');
      } else {
        diceResults = imported;
        $('importStr').value = '';
        renderDiceResults();
        let msg = `成功导入 ${imported.length} 位画师`;
        if (notFound.length > 0) msg += `，未找到：${notFound.slice(0, 3).join(', ')}`;
        if (parseErrors.length > 0) msg += `，格式错误：${parseErrors.length} 个`;
        toast(msg);
      }
    });

    function buildPrompt() {
      if (diceResults.length === 0) {
        toast('请先抽取或导入画师', 'err');
        return null;
      }
      const artistTags = diceResults.map(r => {
        const weight = r.weight;
        let suffix = '';
        if (weight > 1) {
          const times = Math.round((weight - 1) * 10);
          suffix = '{' + '}'.repeat(Math.min(times, 10));
        } else if (weight < 1) {
          const times = Math.round((1 - weight) * 20);
          suffix = '[' + ']'.repeat(Math.min(times, 10));
        }
        return `artist:${r.name}${suffix}`;
      }).join(', ');
      const base = $('fixedPrompt').value.trim();
      return base ? `${artistTags}, ${base}` : artistTags;
    }

    // ===== 云端队列客户端（参考智绘姬 / NAI文生图V2 实现）=====
    class CloudQueueClient {
      constructor(baseUrl) {
        this.baseUrl = (baseUrl || '').trim().replace(/\/+$/, '');
        this.taskId = null;
        this.pollingInterval = null;
        this._heartbeatInterval = null;
      }
      async submitTask(payload, apiKey, greeting) {
        const taskId = 'task_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
        const coordBody = JSON.stringify({
          task_id: taskId,
          greeting: greeting || '正在生成中~',
          input: payload.input || payload.prompt || ''
        });
        const endpoints = [
          `${this.baseUrl}/join-queue`,
          `${this.baseUrl}/submit`,
          `${this.baseUrl}/queue`,
          `${this.baseUrl}/generate`
        ];
        const headers = { 'Content-Type': 'application/json' };
        for (const endpoint of endpoints) {
          try {
            const response = await fetch(endpoint, { method: 'POST', headers, body: coordBody });
            if (response.ok) {
              const data = await response.json();
              const returnedTaskId = data.taskId || data.task_id || taskId;
              this.taskId = returnedTaskId;
              return {
                taskId: returnedTaskId,
                position: (data.position !== undefined && data.position !== null) ? data.position : '排队中',
                status: data.status || (data.position === 0 ? 'processing' : 'pending'),
                queueSize: data.queue_size,
                your_turn: data.is_my_turn || data.your_turn || data.position === 0,
                cooling_down: data.cooling_down || false,
                cooldown_remaining: data.cooldown_remaining || 0
              };
            }
          } catch (err) { }
        }
        throw new Error('队列服务连接失败，请检查地址或服务状态');
      }
      async waitForResult(onStatus) {
        return new Promise((resolve, reject) => {
          let notFoundCount = 0;
          const poll = async () => {
            try {
              let status;
              try {
                const resp = await fetch(`${this.baseUrl}/my-turn?task_id=${this.taskId}`);
                if (resp.ok) {
                  const data = await resp.json();
                  status = {
                    your_turn: data.is_my_turn,
                    position: data.position,
                    greeting: data.current_greeting,
                    cooling_down: data.cooling_down || false,
                    cooldown_remaining: data.cooldown_remaining || 0
                  };
                } else { throw new Error('my-turn failed'); }
              } catch (e) {
                const resp2 = await fetch(`${this.baseUrl}/status/${this.taskId}`);
                if (!resp2.ok) {
                  if (resp2.status === 404) {
                    notFoundCount++;
                    if (notFoundCount >= 3) throw new Error('任务不存在（可能已过期或服务已重启）');
                    return;
                  }
                  throw new Error(`HTTP ${resp2.status}`);
                }
                notFoundCount = 0;
                status = await resp2.json();
              }
              onStatus && onStatus(status);
              if (status.your_turn || status.is_my_turn) {
                if (this.pollingInterval) clearInterval(this.pollingInterval);
                status.need_generate = true;
                resolve(status);
                return;
              }
              if (status.completed) {
                if (this.pollingInterval) clearInterval(this.pollingInterval);
                if (status.result) resolve(status.result);
                else if (status.imageData) resolve({ imageBase64: status.imageData });
                else reject(new Error('生成结果为空'));
              } else if (status.failed) {
                if (this.pollingInterval) clearInterval(this.pollingInterval);
                reject(new Error(status.error || '生成失败'));
              }
            } catch (err) {
              if (err.message && err.message.includes('任务不存在')) {
                if (this.pollingInterval) clearInterval(this.pollingInterval);
                reject(err);
              }
            }
          };
          poll();
          this.pollingInterval = setInterval(poll, 1000);
        });
      }
      async completeTask(taskId) {
        try { await fetch(`${this.baseUrl}/complete/${taskId}`, { method: 'POST', headers: { 'Content-Type': 'application/json' } }); } catch (e) { }
      }
      startHeartbeat(taskId) {
        this.stopHeartbeat();
        this._heartbeatInterval = setInterval(() => {
          fetch(`${this.baseUrl}/heartbeat/${taskId}`, { method: 'POST' }).catch(() => { });
        }, 5000);
      }
      stopHeartbeat() { if (this._heartbeatInterval) { clearInterval(this._heartbeatInterval); this._heartbeatInterval = null; } }
      async cancelTask(taskId) {
        try { await fetch(`${this.baseUrl}/cancel/${taskId}`, { method: 'POST' }).catch(() => { }); } catch (e) { }
        try { await fetch(`${this.baseUrl}/leave-queue`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ task_id: taskId }) }).catch(() => { }); } catch (e) { }
      }
      abort() { if (this.pollingInterval) { clearInterval(this.pollingInterval); this.pollingInterval = null; } }
    }
    let currentQueueClient = null;

    function processZipResult(buf) {
      return JSZip.loadAsync(buf).then(zip => {
        const imgFile = Object.values(zip.files).find(f => /\.(png|jpg|jpeg|webp)$/i.test(f.name) && !f.dir);
        if (!imgFile) throw new Error('ZIP 中未找到图片');
        return imgFile.async('blob').then(blob => ({ blob: blob, blobUrl: URL.createObjectURL(blob) }));
      });
    }

    async function generateOne(prompt, negative) {
      const base = (settings.apiBase || 'https://image.novelai.net').replace(/\/+$/, '');
      const url = base + '/ai/generate-image';

      const model = $('model').value;
      const [w, h] = $('resolution').value.split('x').map(Number);
      const seedInput = parseInt($('seed').value);
      let seed = seedInput === -1 ? Math.floor(Math.random() * 4294967295) : seedInput;

      const ucPresetMap = { none: 0, soft: 1, medium: 2, heavy: 3 };
      const ucPresetValue = ucPresetMap[$('ucPreset').value] || 0;

      const isV4 = model.startsWith('nai-diffusion-4');
      const params = {
        params_version: isV4 ? 3 : 1,
        width: w, height: h,
        scale: parseFloat($('scale').value),
        sampler: $('sampler').value,
        steps: parseInt($('steps').value),
        seed, n_samples: 1,
        ucPreset: ucPresetValue, qualityToggle: true,
        negative_prompt: negative,
        noise_schedule: $('noiseSchedule').value,
        sm: false, sm_dyn: false, cfg_rescale: 0,
        dynamic_thresholding: false, prefer_brownian: true,
        deliberate_euler_ancestral_bug: true,
        legacy: false, legacy_v3_extend: false
      };

      if (isV4) {
        params.v4_prompt = { caption: { base_caption: prompt, char_captions: [] }, use_coords: false, use_order: true, legacy_uc: false };
        params.v4_negative_prompt = { caption: { base_caption: negative, char_captions: [] }, use_coords: false, use_order: true, legacy_uc: false };
      }

      const payload = { input: prompt, model, action: 'generate', parameters: params };

      // 云端队列模式
      if (settings.enableCloudQueue && settings.cloudQueueUrl) {
        return await generateViaQueue(payload, prompt, seed, model, w, h);
      }

      setStatus('loading', '生成中...');
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + settings.token, 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (!res.ok) {
        let detail = '';
        try { detail = await res.text(); } catch (e) { }
        throw new Error(`HTTP ${res.status}\n${detail.slice(0, 500)}`);
      }

      const buf = await res.arrayBuffer();
      const r = await processZipResult(buf);
      return { blobUrl: r.blobUrl, seed, model, w, h };
    }

    // 云端队列生成（协调式：排队等候，轮到自己时前端直连 NovelAI 生图）
    async function generateViaQueue(payload, prompt, seed, model, w, h) {
      const queueClient = new CloudQueueClient(settings.cloudQueueUrl);
      currentQueueClient = queueClient;
      $('queueStatus').style.display = 'flex';
      $('queuePosition').textContent = '排队中';
      $('queueGreeting').textContent = '';

      try {
        const submitResult = await queueClient.submitTask(payload, settings.token, settings.cloudQueueGreeting || '正在生成中~');
        const updPos = (s) => {
          if (s.position !== undefined) {
            const pos = s.position;
            if (s.cooling_down) $('queuePosition').textContent = `冷却中 (${s.cooldown_remaining || '?'}秒)`;
            else if (pos === 0) $('queuePosition').textContent = s.your_turn ? '第1位 (生成中)' : '第1位';
            else $('queuePosition').textContent = `前方还有 ${pos} 个任务`;
          }
          if (s.greeting) $('queueGreeting').textContent = s.greeting;
        };
        if (submitResult.position !== undefined) updPos(submitResult);

        const waitResult = await queueClient.waitForResult(updPos);

        // 协调模式：轮到自己，前端直连 NovelAPI 生图
        if (waitResult.need_generate) {
          $('queuePosition').textContent = '生成中...';
          $('queueGreeting').textContent = '';
          queueClient.startHeartbeat(submitResult.taskId);
          try {
            const base = (settings.apiBase || 'https://image.novelai.net').replace(/\/+$/, '');
            const genResponse = await fetch(base + '/ai/generate-image', {
              method: 'POST',
              headers: { 'Authorization': 'Bearer ' + settings.token, 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });
            if (!genResponse.ok) {
              const errText = await genResponse.text();
              queueClient.stopHeartbeat();
              await queueClient.cancelTask(submitResult.taskId);
              throw new Error('NovelAI 生图失败: HTTP ' + genResponse.status + ' ' + errText.slice(0, 200));
            }
            const buf = await genResponse.arrayBuffer();
            queueClient.stopHeartbeat();
            await queueClient.completeTask(submitResult.taskId);
            const r = await processZipResult(buf);
            return { blobUrl: r.blobUrl, seed, model, w, h };
          } catch (genErr) {
            queueClient.stopHeartbeat();
            try { await queueClient.cancelTask(submitResult.taskId); } catch (e) { }
            throw genErr;
          }
        }
        // 代理模式：队列服务直接返回结果
        if (waitResult.blobUrl || waitResult.blob) {
          return { blobUrl: waitResult.blobUrl || URL.createObjectURL(waitResult.blob), seed, model, w, h };
        } else if (waitResult.imageBase64) {
          const imageData = waitResult.imageBase64;
          const binary = atob(imageData.startsWith('data:') ? (imageData.split(',')[1] || imageData) : imageData);
          const bytes = new Uint8Array(binary.length);
          for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
          return { blobUrl: URL.createObjectURL(new Blob([bytes], { type: 'image/png' })), seed, model, w, h };
        }
        throw new Error('队列返回的结果格式不正确');
      } finally {
        currentQueueClient = null;
        queueClient.abort();
        $('queueStatus').style.display = 'none';
      }
    }

    $('btnGenerate').addEventListener('click', async () => {
      if (!checkToken()) return;
      const prompt = buildPrompt();
      if (!prompt) return;
      const negative = $('negativePrompt').value.trim();

      $('placeholder').style.display = 'none';
      $('resultImg').style.display = 'none';
      $('resultMeta').style.display = 'none';
      $('progressWrap').classList.add('active');
      $('btnGenerate').disabled = true;

      try {
        let r;
        try {
          r = await generateOne(prompt, negative);
        } catch (err) {
          // 云端队列失败时回退到直连生成
          if (settings.enableCloudQueue && settings.cloudQueueUrl && !err.message.includes('NovelAI')) {
            console.warn('[Gen] 云端队列失败，回退直连:', err.message);
            toast('云端队列失败，回退直连生成', 'err');
            const backup = settings.enableCloudQueue;
            settings.enableCloudQueue = false;
            try { r = await generateOne(prompt, negative); }
            finally { settings.enableCloudQueue = backup; }
          } else { throw err; }
        }
        $('resultImg').src = r.blobUrl;
        $('resultImg').style.display = 'block';
        $('resultMeta').innerHTML = `
          <span class="chip">种子: ${r.seed}</span>
          <span class="chip">${r.w}×${r.h}</span>
          <span class="chip">${$('steps').value}步 / CFG ${$('scale').value}</span>
          <span class="chip">${r.model}</span>
        `;
        $('resultMeta').style.display = 'flex';
        setStatus('ok', '生成完成');
        toast('生成成功', 'ok');
        addGenHistory(r.blobUrl, r.seed, r.model, r.w, r.h);
      } catch (err) {
        console.error(err);
        setStatus('err', '生成失败');
        toast(err.message.slice(0, 50), 'err');
      } finally {
        $('progressWrap').classList.remove('active');
        $('btnGenerate').disabled = false;
      }
    });

    function escapeHtml(s) {
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // 初始化
    (async () => {
      try {
        await initDB();
        await loadData();
        await initHistoryDB();
        await loadGenHistory();
        initCollapsible('diceSettingsHeader', 'diceSettingsContent');
        initCollapsible('importSettingsHeader', 'importSettingsContent');
        initCollapsible('diceResultsHeader', 'diceResultsContent');
        initCollapsible('genSettingsHeader', 'genSettingsContent');
        initCollapsible('historyHeader', 'historyContent');
        initCollapsible('modelSamplingHeader', 'modelSamplingContent');
        toast(`加载完成：${artists.length} 位画师，${artworks.length} 幅作品`);
      } catch (e) {
        console.error('加载数据失败:', e);
        toast('加载数据失败，请确保画师库已打开过', 'err');
      }
    })();
  </script>
